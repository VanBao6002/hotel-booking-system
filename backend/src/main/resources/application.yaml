spring:
  application:
    name: hotel-booking

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/hotel_booking?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:hotel_user}
    password: ${SPRING_DATASOURCE_PASSWORD:hotel_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

server:
  port: 8080
  error:
    include-message: always

logging:
  level:
    com.hotel.booking: DEBUG
    org.springframework.security: DEBUG

jwt:
  secret: ${JWT_SECRET:change-me-in-production}
  access-token-expiration-seconds: 3600
  reset-token-expiration-seconds: 900

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}