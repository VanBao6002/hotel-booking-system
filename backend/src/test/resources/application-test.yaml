spring:
  datasource:
    url: jdbc:h2:mem:hotel_booking_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

jwt:
  secret: test-test-test-test-test-test-test-test-test-test-test-test-test-test-test
  access-token-expiration-seconds: 3600
  reset-token-expiration-seconds: 900

app:
  cors:
    allowed-origins: http://localhost:3000